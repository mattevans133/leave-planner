<style id="app-css">
:root{

  --clin:#2f6fb3;--clin-bg:#e3edf9;--res:#2e8a5c;--res-bg:#e2f3e8;--off:#9aa3ad;--off-bg:#eef0f3;
  --fix:#3b3f45;--fix-bg:#dcdfe3;--leave:#d9622b;--leave-bg:#fde7dc;--run:#fff3c4;--run-line:#e2bd2f;
  --block:#ebe4f7;--block-ink:#6a4fa3;--na:#fbe3e3;--na-ink:#b03a3a;--bh:#efe9fa;--bh-ink:#7a62b0;
  --motion:#7c3aed;--motion-bg:#efe7fe;--home:#0f766e;--home-bg:#dcf3f0;--dl:#b45309;--dl-bg:#fdefd9;--other:#475569;--other-bg:#e8ecf1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 70px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-bottom:12px}
h1{font-size:21px;margin:0;font-weight:680;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px}
.save{margin-left:auto;font-size:12px;color:var(--muted)}
.save.dirty{color:var(--leave)}
.tabs{display:flex;gap:2px;background:#e9ebee;border-radius:10px;padding:3px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);border-radius:8px;white-space:nowrap;font-weight:550}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:15px;margin:0 0 4px}
.hint{margin:0 0 12px;color:var(--muted);font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.empty{color:var(--faint);font-size:13px;padding:6px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b9c3cf}
.btn.pri{background:var(--clin);color:#fff;border-color:var(--clin)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.dan{color:var(--na-ink)}
.btn.ic{width:34px;padding:6px 0;text-align:center}
.seg{display:inline-flex;background:#e9ebee;border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px;font-size:13px}
.ctl label{display:inline-flex;align-items:center;gap:6px}
input[type=date],input[type=number],input[type=text],input[type=password],select,textarea{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff}
.navbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.navbar .ttl{font-size:17px;font-weight:650;margin:0 6px}
.navbar .ttl small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.navbar .sp{flex:1}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.chip.C{background:var(--clin-bg);color:var(--clin)}
.chip.R{background:var(--res-bg);color:var(--res)}
.chip.O{background:var(--off-bg);color:#7b848e}
.chip.F{background:var(--fix-bg);color:var(--fix)}
.chip.L{background:var(--leave);color:#fff}
.chip.H{background:var(--bh);color:var(--bh-ink)}
.chip.oc{background:var(--na-ink);color:#fff}
.chip.T{background:#fff;color:var(--leave);box-shadow:inset 0 0 0 1px #f1b597}
.chip.A{background:#e7eefb;color:#1f4f8f;box-shadow:inset 0 0 0 1px #c3d5ef}
.chip.P{background:#fff;color:var(--leave);box-shadow:inset 0 0 0 1.5px var(--leave);border-style:dashed}
.chip.blk{background:var(--block);color:var(--block-ink)}
.chip .sl{opacity:.7;font-weight:500}
.wo{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:3px 8px 3px 4px;font-size:12.5px;cursor:pointer;max-width:100%;border:1px solid transparent}
.wo .tg{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 4px;border-radius:5px;color:#fff;font-size:11px;font-weight:700}
.wo .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wo.motion{background:var(--motion-bg)}.wo.motion .tg{background:var(--motion)}
.wo.home{background:var(--home-bg)}.wo.home .tg{background:var(--home)}
.wo.dl{background:var(--dl-bg)}.wo.dl .tg{background:var(--dl)}
.wo.other{background:var(--other-bg)}.wo.other .tg{background:var(--other)}
.sugg{display:inline-flex;align-items:center;gap:6px;border:1px dashed #9fd2b4;background:#f3faf6;color:var(--res);border-radius:7px;padding:2px 8px;font-size:12px;font-weight:600}
.addbtn{border:1px dashed #c9d0d8;background:none;border-radius:7px;padding:2px 9px;font-size:12px;color:var(--muted);cursor:pointer}
.addbtn:hover{border-color:var(--clin);color:var(--clin)}
.qa{display:inline-flex;gap:3px;flex-wrap:wrap}
.qa button{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;font-weight:700;padding:2px 6px;cursor:pointer;color:var(--muted)}
.qa button:hover{border-color:currentColor}
.qa button.motion{color:var(--motion)}.qa button.home{color:var(--home)}.qa button.dl{color:var(--dl)}.qa button.other{color:var(--other)}
/* summary strip */
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px;flex:1}
.tile .n{font-size:20px;font-weight:680;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .l{font-size:12px;color:var(--muted)}
.tile.warn .n{color:var(--na-ink)}
.meter{height:6px;background:#eceef1;border-radius:3px;margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--motion);border-radius:3px}
.meter.over i{background:var(--na-ink)}
/* week view */
.wk-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 2px 6px}
.day{display:grid;grid-template-columns:92px 1fr 1.25fr;gap:10px 14px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:6px;cursor:pointer;align-items:start}
.day:hover{border-color:#c8d0da}
.day.we{background:#fafbfc}
.day.today{box-shadow:inset 3px 0 0 var(--clin)}
.day.past{opacity:.55}
.day .dd{line-height:1.2}
.day .dd b{display:block;font-size:20px;font-weight:680}
.day .dd span{font-size:12px;color:var(--muted)}
.day .dd .dn{font-size:13px;font-weight:650;color:var(--ink)}
.day .cell{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:24px}
.day .lbl{display:none;font-size:11px;color:var(--faint);width:100%;text-transform:uppercase;letter-spacing:.4px}
.day .nt{grid-column:2/-1;font-size:12.5px;color:var(--muted);background:#f7f8fa;border-radius:7px;padding:5px 8px;white-space:pre-wrap}
.glance{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.gl{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;display:flex;flex-direction:column;min-width:0;flex:1 1 150px}
.gl[data-act]{cursor:pointer}.gl[data-act]:hover{border-color:#b9c3cf}
.gl .gk{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.gl .gv{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.glance.stack{flex-direction:column}
.glance.stack .gl{flex:none}
.wfoot{display:flex;flex-wrap:wrap;gap:14px 28px}
.wfoot .ft{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.wfoot .fn{font-size:20px;font-weight:680;font-variant-numeric:tabular-nums}
.wfoot .fn.over{color:var(--na-ink)}
.wfoot .fb{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.wkhead{display:grid;grid-template-columns:92px 1fr 1.25fr;gap:14px;padding:0 13px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
/* month view */
.mgrid{display:grid;grid-template-columns:34px repeat(7,1fr);gap:4px}
.mgrid .mh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:0 4px 2px}
.mgrid .mw{font-size:10.5px;color:var(--faint);padding-top:6px;text-align:center;line-height:1.2}
.mc{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:96px;padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.mc:hover{border-color:#b9c3cf}
.mc.we{background:#fafbfc}
.mc.out{opacity:.35}
.mc.run{background:var(--run);border-color:var(--run-line)}
.mc.today{box-shadow:inset 0 0 0 2px var(--clin)}
.mc.blk{background:var(--block)}
.mc .tp{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:650}
.mc .tp .x{margin-left:auto;display:flex;gap:3px;align-items:center}
.mc .bars{display:flex;gap:2px}
.mc .rl{font-size:10.5px;color:#1f4f8f;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mc.pastd{opacity:.6}
.mhead{grid-column:1/-1;font-size:15px;font-weight:680;padding:18px 2px 4px;border-bottom:2px solid var(--ink);margin-bottom:2px}
.mc .bars i{flex:1;height:7px;border-radius:2px}
.mc .tag{font-size:10.5px;font-weight:600;color:var(--block-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .tag.bh{color:var(--bh-ink)}
.mc .ws{display:flex;flex-direction:column;gap:2px}
.mc .w1{display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;overflow:hidden}
.mc .w1 .tg{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:15px;padding:0 3px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:700}
.mc .w1 span:last-child{overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.oc{background:var(--na-ink)}
.dot.nt{background:var(--faint)}
.b-T{background:#f1b597}.b-C{background:var(--clin)}.b-R{background:#7cc79f}.b-O{background:#d5dae0}.b-F{background:var(--fix)}.b-L{background:var(--leave)}.b-H{background:#b9a6e3}.b-E{background:transparent}
.tg.motion{background:var(--motion)}.tg.home{background:var(--home)}.tg.dl{background:var(--dl)}.tg.other{background:var(--other)}
/* year view */
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ym{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 10px 8px}
.ym.pastm{opacity:.55}
.ym h3{margin:0 0 6px;font-size:13.5px;display:flex;justify-content:space-between;align-items:baseline}
.ym h3 small{font-size:11px;font-weight:600;color:var(--leave)}
.yd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.yd .h{font-size:9.5px;color:var(--faint);text-align:center}
.yc{aspect-ratio:1;border-radius:5px;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.yc.e{cursor:default}
.yc.clin{background:var(--clin-bg);color:var(--clin)}
.yc.free{background:#f6f7f8;color:#8d959e}
.yc.we{background:transparent;color:#aab1b9}
.yc.lv{background:var(--leave);color:#fff;font-weight:700}
.yc.pl{background:#fff;color:var(--leave);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--leave)}
.yc.ot{background:#fbe5d9;color:var(--leave)}
.yc.lvp{background:linear-gradient(135deg,var(--leave) 50%,var(--clin-bg) 50%);color:#fff;font-weight:700}
.yc.bh{background:var(--bh);color:var(--bh-ink);font-weight:600}
.yc.blk{background:var(--block);color:var(--block-ink)}
.yc.na{box-shadow:inset 0 0 0 1.5px var(--na-ink)}
.yc.run{outline:2px solid var(--run-line);outline-offset:-1px}
.yc.today{box-shadow:inset 0 0 0 2px var(--ink)}
.yc.past{opacity:.45}
.yc .ocd{position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--na-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.pill-day{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--off-bg)}
.pill-day.pref{background:#fff1c7;color:#7a5600}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--res);vertical-align:middle}
.star{color:#c98a00}
/* pattern editor */
.pat{display:grid;grid-template-columns:62px repeat(5,minmax(92px,1fr));gap:4px;min-width:560px}
.pat .ph{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:2px 4px}
.pat .pw{font-size:13px;font-weight:600;padding:6px 2px}
.pat .pc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px}
.pat .row{display:flex;gap:4px;align-items:center}
.pat .row .k{font-size:10px;color:var(--faint);width:26px}
.pat .row .chip{cursor:pointer;flex:1;justify-content:center}
.pat .cost{font-size:11px;color:var(--muted);margin-top:2px}
.lprev{border:1px solid var(--line);border-radius:8px;padding:4px 16px;background:#fff;max-height:420px;overflow:auto}
.lprev h3{font-size:16px;margin:12px 0 8px}
.lprev ul{padding-left:20px}
.lta{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;background:#fff}
.banner{background:#fff4e5;border:1px solid #f3d3a6;color:#7a4b06;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
/* dialog */
.scrim{position:fixed;inset:0;background:rgba(20,24,30,.38);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.scrim.on{display:flex}
.dlg{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:16px 18px 18px;box-shadow:0 12px 40px rgba(0,0,0,.22)}
.dlg .dh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.dlg .dh h3{margin:0;font-size:17px;flex:1}
.dlg .meta{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.dlg h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.slotrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f2f4}
.slotrow:last-child{border-bottom:0}
.slotrow .k{width:34px;font-size:12px;color:var(--faint);font-weight:600}
.slotrow .v{flex:1}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:8px;border-radius:9px;margin-bottom:6px}
.wrow.motion{background:var(--motion-bg)}.wrow.home{background:var(--home-bg)}.wrow.dl{background:var(--dl-bg)}.wrow.other{background:var(--other-bg)}
.wrow select{font-size:13px;padding:4px 6px}
.wrow input[type=text]{grid-column:1/-1;width:100%}
.wrow .rm{border:0;background:none;color:var(--na-ink);font-size:18px;cursor:pointer;padding:0 6px}
.wsel{display:flex;gap:6px}
.addrow{display:flex;flex-wrap:wrap;gap:6px}
.addrow button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.addrow button .tg{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:18px;padding:0 3px;border-radius:5px;color:#fff;font-size:10.5px;font-weight:700}
.dlg textarea{width:100%;resize:vertical}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0}
@media (max-width:760px){
  .wrap{padding:12px 10px 60px}
  h1{font-size:18px}
  .day{grid-template-columns:58px 1fr;gap:6px 10px}
  .day .fit{grid-column:2}
  .day .lbl{display:block}
  .day .nt{grid-column:1/-1}
  .wkhead{display:none}
  .mc{min-height:62px;padding:3px 4px;border-radius:7px}
  .mc .tag,.mc .w1 span:last-child,.mc .rl{display:none}
  .mc .ws{flex-direction:row;flex-wrap:wrap}
  .mgrid{grid-template-columns:22px repeat(7,1fr);gap:3px}
  .mgrid .mw{font-size:9px}
  .mgrid .mh{font-size:9.5px;padding:0 1px}
  .tile{min-width:90px;padding:7px 10px}
  .tile .n{font-size:17px}
  .scrim{padding:0;align-items:flex-end}
  .dlg{border-radius:16px 16px 0 0;max-height:94vh}
}
</style>
</head>

// ---------- dates ----------

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

// ---------- model ----------
function isBH(d){return !!BH[K(d)];}
function sessionsFor(d){var wd=dow(d);if(wd>4)return null;return S.pattern[rotaWeek(d)][wd];}
function fixedName(d){var n=S.fixedNames[String(rotaWeek(d)%4)];return n||"Fixed";}
function blockFor(d){
  var k=K(d);
  for(var i=0;i<S.blocks.length;i++){var b=S.blocks[i];if(b.start&&b.end&&k>=b.start&&k<=b.end)return b;}
  return null;
}
function lk(d,i){return K(d)+"|"+i;}
// ---------- rota (CLW feed via the sync gist) ----------
var rotaIdx=null;
function rotaOn(){return !!(R&&R.work);}
function rotaIndex(){
  if(rotaIdx)return rotaIdx;
  var w={},max="";
  if(R)(R.work||[]).forEach(function(e){(w[e.d]=w[e.d]||[]).push(e);if(e.d>max)max=e.d;});
  rotaIdx={w:w,l:(R&&R.leave)||[],max:max};
  return rotaIdx;
}
function rotaWork(k){return rotaIndex().w[k]||[];}
function isOC(e){return /on.?call/i.test(e.l);}
function onCall(k){return !!S.onCall[k]||rotaWork(k).some(isOC);}
function rotaLeaveFor(d,i){
  var k=K(d),L=rotaIndex().l;
  for(var j=0;j<L.length;j++){
    var x=L[j];if(k<x.from||k>x.to)continue;
    if(i===0&&k===x.from&&x.st>="12:00")continue;
    if(i===1&&k===x.to&&x.en<="13:00")continue;
    return x.t||"Leave";
  }
  return null;
}
function isRotaAL(d,i){return /annual/i.test(rotaLeaveFor(d,i)||"");}
function isPlanned(d,i){return !!S.leave[lk(d,i)];}
function isLeave(d,i){return isPlanned(d,i)||isRotaAL(d,i);}
function showPlanned(d,i){return rotaOn()&&isPlanned(d,i);}
function dayCovered(d,s){
  var day=[0,1].filter(function(i){return s[i]==="C";});
  return day.length>0&&day.every(function(i){return isLeave(d,i);});
}
function eff(d){
  var s=sessionsFor(d);if(!s)return null;
  if(isBH(d))return s.map(function(t){return t==="E"?"E":"H";});
  var out=s.map(function(t,i){
    if(t!=="C"||i===2)return t;
    if(isLeave(d,i))return "L";
    if(rotaLeaveFor(d,i))return "T";
    return t;
  });
  if(s[2]==="C"){var day=[0,1].filter(function(i){return s[i]==="C";});
    if(day.length&&day.every(function(i){return out[i]==="L"||out[i]==="T";}))out[2]=out[day[0]];}
  return out;
}
function otherLeaveName(d){for(var i=0;i<2;i++){var t=rotaLeaveFor(d,i);if(t&&!/annual/i.test(t))return t;}return "Other leave";}
function isFreeDay(d){
  var k=K(d);
  if(onCall(k))return false;
  var b=blockFor(d);if(b&&b.kind==="booked")return true;
  var e=eff(d);if(!e)return true;
  for(var i=0;i<e.length;i++){var t=e[i];if(t==="C"||t==="F")return false;if(t==="R"&&!S.researchFree)return false;}
  return true;
}
function cleanLeave(){
  Object.keys(S.leave).forEach(function(k){
    var p=k.split("|"),d=P(p[0]),s=sessionsFor(d);
    if(!s||s[+p[1]]!=="C"||isBH(d)||+p[1]===2||isRotaAL(d,+p[1]))delete S.leave[k];
  });
}
function yearBounds(ref){
  ref=ref||today();
  var md=S.yearStart.split("-"),st=new Date(ref.getFullYear(),+md[0]-1,+md[1]);
  if(st>ref)st=new Date(ref.getFullYear()-1,+md[0]-1,+md[1]);
  var en=add(new Date(st.getFullYear()+1,st.getMonth(),st.getDate()),-1);
  return {start:st,end:en,key:K(st)};
}
function yearEnd(){return K(yearBounds().end);}
function plannerLeave(){
  var y=yearBounds(),a=K(y.start),b=K(y.end),n=0;
  Object.keys(S.leave).forEach(function(k){var d=k.split("|")[0];if(S.leave[k]&&d>=a&&d<=b)n++;});
  return n;
}
var bookedCache=null;
function bookedLeave(){
  if(bookedCache!=null)return bookedCache;
  var n=0;if(rotaOn()){var y=yearBounds();
    for(var d=new Date(y.start);d<=y.end;d=add(d,1)){var s=sessionsFor(d);if(!s||isBH(d))continue;for(var i=0;i<2;i++)if(s[i]==="C"&&isRotaAL(d,i))n++;}}
  bookedCache=n;return n;
}
function adjustNow(){return rotaOn()?0:+(S.adjust[yearBounds().key]||0);}
function leaveCount(){return bookedLeave()+plannerLeave()+adjustNow();}
function sessionsLeft(){return S.annual-leaveCount();}
function rangeDays(){
  var out=[],d=monday(today()),end=add(monday(P(yearEnd())),6);
  for(;d<=end;d=add(d,1))out.push(d);
  return out;
}
var runCache=null;
function computeRuns(){
  if(runCache)return runCache;
  var y=yearBounds(),days=[],d=monday(y.start),end=add(monday(y.end),6);
  for(;d<=end;d=add(d,1))days.push(d);
  var runs=[],cur=null;
  days.forEach(function(d){
    if(isFreeDay(d)){
      if(!cur)cur={start:d,end:d,leave:0,other:0,days:0};
      cur.end=d;cur.days++;
      var e=eff(d);
      if(e){cur.leave+=e.filter(function(t,i){return t==="L"&&i!==2;}).length;cur.other+=e.filter(function(t,i){return t==="T"&&i!==2;}).length;}
    }else{if(cur)runs.push(cur);cur=null;}
  });
  if(cur)runs.push(cur);
  runCache=runs.filter(function(r){return r.leave>0||r.other>0;});
  return runCache;
}
function runSet(){var o={};computeRuns().forEach(function(r){for(var d=r.start;d<=r.end;d=add(d,1))o[K(d)]=1;});return o;}
function quickWins(){
  var res=[];
  function free(i){
    var ww=((Math.floor(i/7))%8+8)%8,dd=((i%7)+7)%7;
    if(dd>4)return true;
    var x=S.pattern[ww][dd];
    for(var j=0;j<x.length;j++){var t=x[j];if(t==="C"||t==="F")return false;if(t==="R"&&!S.researchFree)return false;}
    return true;
  }
  for(var w=0;w<8;w++)for(var wd=0;wd<5;wd++){
    var s=S.pattern[w][wd];
    if(s.indexOf("F")>=0)continue;
    var cost=s.filter(function(t,i){return t==="C"&&i!==2;}).length;
    if(!cost)continue;
    var idx=w*7+wd,len=1,i=idx-1,back=0;
    while(back<14&&free(i)){len++;i--;back++;}
    i=idx+1;var fwd=0;while(fwd<14&&free(i)){len++;i++;fwd++;}
    res.push({w:w,wd:wd,cost:cost,len:len,score:len/cost,pref:!!PREF[wd],startOff:back,endOff:fwd});
  }
  res.sort(function(a,b){return (b.score*(b.pref?1.5:1))-(a.score*(a.pref?1.5:1))||a.cost-b.cost||b.len-a.len;});
  return res;
}
function nextDateFor(w,wd){
  var end=P(yearEnd());
  for(var i=0;i<60;i++){
    var m=add(monday(today()),7*i),day=add(m,wd);
    if(day>end)return null;
    if(day<=today())continue;
    if(rotaWeek(m)!==w)continue;
    if(blockFor(day)||isBH(day))continue;
    var s=sessionsFor(day);
    if(s.every(function(t,j){return t!=="C"||j===2||isLeave(day,j);}))continue;
    return day;
  }
  return null;
}

// ---------- workouts ----------
function wos(k){return S.workouts[k]||[];}
function woTemplate(d){
  var w=rotaWeek(d)%4,wd=dow(d),key=w+"-"+wd;
  if(S.woTemplate&&S.woTemplate[key]!=null)return S.woTemplate[key];
  return DEFAULT_WO[w][wd];
}
function motionLimit(m){
  var n=5;S.motionPlans.slice().sort(function(a,b){return a.from<b.from?-1:1;}).forEach(function(p){if(p.from<=m)n=p.n;});
  return n;
}
function motionCount(m){
  var n=0;Object.keys(S.workouts).forEach(function(k){if(k.slice(0,7)===m)wos(k).forEach(function(x){if(x.t==="motion")n++;});});
  return n;
}
function woLabel(x,short){return (short?WT[x.t].n:WT[x.t].long)+(x.w?" · "+WHEN[x.w]:"")+(x.n?" – "+x.n:"");}

// ---------- describing a day ----------
function slotName(d,t){return t==="F"?fixedName(d):t==="T"?otherLeaveName(d):TYPE_NAME[t];}
var SI={am:0,pm:1,eve:2,night:3},SN=["AM","PM","Eve","Night"];
// Rota allocations for a day, grouped: [{label, slots:[...], oc:bool}]
function rotaGroups(k){
  var ev=rotaWork(k),g=[],by={};
  ev.forEach(function(e){var key=e.l;if(!by[key]){by[key]={label:e.l,slots:[],oc:isOC(e)};g.push(by[key]);}by[key].slots.push(SI[e.s]!=null?SI[e.s]:-1);});
  return g;
}
function slotList(sl){return sl.filter(function(i){return i>=0;}).sort().map(function(i){return SN[i];}).join("+");}
function rotaText(k){
  return rotaGroups(k).map(function(g){return g.oc?"On call ("+slotList(g.slots).toLowerCase()+")":slotList(g.slots)+" "+g.label;}).join(" · ");
}
function workText(d){
  var k0=K(d);
  if(rotaWork(k0).length){
    var e0=eff(d),used={},extra=[];
    rotaWork(k0).forEach(function(e){if(SI[e.s]!=null)used[SI[e.s]]=1;});
    if(e0)e0.forEach(function(t,i){if(i<2&&!used[i]&&t!=="E"&&t!=="C")extra.push(SN[i]+" "+(t==="L"?"Leave":slotName(d,t)));});
    var b0=blockFor(d);
    return [rotaText(k0)].concat(extra).concat(b0?[b0.label]:[]).join(" · ");
  }
  return workTextPlan(d);
}
function workTextPlan(d){
  var k=K(d),e=eff(d),b=blockFor(d),parts=[];
  if(!e)parts.push("Weekend");
  else if(isBH(d))parts.push("Bank holiday – "+BH[k]);
  else{
    var a=e[0],p=e[1],v=e[2];
    var nm=function(t){return t==="L"?"Leave":slotName(d,t);};
    if(a===p){
      var base=a==="L"?"Annual leave":a==="T"?otherLeaveName(d):a==="O"?"Off":a==="R"?"Research day":nm(a)+" all day";
      parts.push(base+(v!=="E"&&v!=="L"?" + evening ("+nm(v).toLowerCase()+")":""));
    }else{
      parts.push("AM "+nm(a)+" · PM "+nm(p)+(v!=="E"&&v!=="L"?" · Evening "+nm(v):""));
    }
  }
  if(b)parts.push(b.label);
  if(onCall(k))parts.push("On call");
  return parts.join(" · ");
}

// ---------- GitHub gist sync ----------
var gh={token:"",gist:""},syncTimer=null,syncText="";
try{gh.token=localStorage.getItem("lp-gh-token")||"";gh.gist=localStorage.getItem("lp-gh-gist")||"";}catch(e){}
var GIST_FILE="leave-planner.json";
function ghFetch(method,path,body){
  return fetch("https://api.github.com"+path,{method:method,headers:{"Authorization":"Bearer "+gh.token,"Accept":"application/vnd.github+json"},body:body?JSON.stringify(body):undefined})
    .then(function(r){if(!r.ok)throw new Error("GitHub said "+r.status+(r.status===401?" (token not accepted)":r.status===404?" (gist not found)":""));return r.json();});
}
function hhmm(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function syncPush(){
  if(!gh.token||!gh.gist)return Promise.resolve();
  var files={};files[GIST_FILE]={content:JSON.stringify(S)};
  return ghFetch("PATCH","/gists/"+gh.gist,{files:files}).then(function(){syncText="Synced "+hhmm();setSaveText(syncText);})
    .catch(function(e){syncText="Sync failed – "+e.message;setSaveText(syncText);});
}
function syncPull(){
  if(!gh.token||!gh.gist)return Promise.resolve(false);
  return ghFetch("GET","/gists/"+gh.gist).then(function(g){
    var rf=g.files&&g.files["rota.json"],rotaChanged=false;
    if(rf&&rf.content){try{var ro=JSON.parse(rf.content);if(!R||ro.fetched!==R.fetched){R=ro;rotaChanged=true;resetCaches();try{localStorage.setItem("lp-rota",rf.content);}catch(e){}}}catch(e){}}
    var f=g.files&&g.files[GIST_FILE];if(!f)return rotaChanged;
    var o=JSON.parse(f.content);
    syncText="Synced "+hhmm();
    if(o&&o.pattern&&(o.updatedAt||0)>(S.updatedAt||0)){S=o;migrate();resetCaches();try{localStorage.setItem("leave-planner-state",JSON.stringify(S));}catch(e){}return true;}
    if((S.updatedAt||0)>(o.updatedAt||0))return syncPush().then(function(){return rotaChanged;});
    return rotaChanged;
  }).catch(function(e){syncText="Sync failed – "+e.message;return false;});
}
function syncConnect(token,gist){
  gh.token=token.trim();gh.gist=(gist||"").trim().replace(/^.*\//,"");
  try{localStorage.setItem("lp-gh-token",gh.token);}catch(e){}
  var p;
  if(gh.gist)p=syncPull();
  else{var files={};files[GIST_FILE]={content:JSON.stringify(S)};
    p=ghFetch("POST","/gists",{description:"Leave Planner data",public:false,files:files}).then(function(g){gh.gist=g.id;syncText="Synced "+hhmm();});}
  return p.then(function(){try{localStorage.setItem("lp-gh-gist",gh.gist);}catch(e){}});
}
function syncDisconnect(){gh={token:"",gist:""};syncText="";try{localStorage.removeItem("lp-gh-token");localStorage.removeItem("lp-gh-gist");}catch(e){}}

function workChips(d){

  var rg=rotaGroups(k);
  if(rg.length){

function rotaAge(){if(!R||!R.fetched)return "never";var m=Math.round((Date.now()-new Date(R.fetched).getTime())/60000);return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago";}
// Estimated PAs from rota sessions (on-call excluded): weekday 07:00–19:00 at 4 h/PA, other time at 3 h/PA
function paEstimate(start,n){
  var r={pa:0,n:0,oc:0,std:0,prem:0};
  for(var i=0;i<n;i++){
    var d=add(start,i),k=K(d),ev=rotaWork(k),ocd=false;
    ev.forEach(function(e){
      if(isOC(e)){ocd=true;return;}
      r.n++;
      var a=hm(e.st),b=hm(e.en);if(b<=a)b+=24*60;
      var std=0,tot=b-a;
      if(dow(d)<5){std=Math.max(0,Math.min(b,19*60)-Math.max(a,7*60));}
      r.std+=std/60;r.prem+=(tot-std)/60;
    });
    if(ocd)r.oc++;
  }
  r.pa=r.std/S.pa.stdH+r.prem/S.pa.premH;
  return r;
}
function paSum(k){return S.pa.items.filter(function(x){return x.k===k;}).reduce(function(a,x){return a+(+x.pa||0);},0);}

// Attendance weeks between two dates: weekdays, less bank holidays and leave of any kind (half-days count as half)
function attendanceWeeks(from,to){
  var days=0;
  for(var d=new Date(from);d<=to;d=add(d,1)){
    if(dow(d)>4||isBH(d))continue;
    var off=0;for(var i=0;i<2;i++)if(isLeave(d,i)||rotaLeaveFor(d,i))off++;
    var b=blockFor(d);if(b&&b.kind==="booked"&&!rotaOn())off=2;
    days+=(2-off)/2;
  }
  return days/5;
}
// Year to date: rota sessions delivered vs the job plan's timetabled DCC for the weeks actually at work
function paYTD(){
  if(!rotaOn())return null;
  var y=yearBounds(),rs=rotaStart(),from=y.start;if(rs&&P(rs)>from)from=P(rs);
  var to=add(today(),-1);if(to<from)return null;
  var n=Math.round((to-from)/864e5)+1,est=paEstimate(from,n),aw=attendanceWeeks(from,to),exp=paSched()*aw;
  var oc=0;for(var d=new Date(from);d<=to;d=add(d,1))if(rotaWork(K(d)).some(isOC))oc++;
  return {from:from,to:to,pa:est.pa,n:est.n,aw:aw,exp:exp,diff:est.pa-exp,oc:oc};
}

      "<input type='text' data-in='wn' data-i='"+i+"' value='"+esc(x.n||"")+"' placeholder='Details, e.g. 10k easy, Engine class, upper body'></div>";
  });
  h+="<div class='addrow'>"+WTK.map(function(t){return "<button data-act='wadd' data-t='"+t+"'><span class='tg "+t+"'>"+WT[t].t+"</span>"+WT[t].n+"</button>";}).join("")+"</div>";
  // notes
  h+="<h4>Note</h4><textarea data-in='dnote' rows='2' placeholder='Anything else for the day, e.g. school run, late finish'>"+esc(S.notes[k]||"")+"</textarea>";
  h+="<div class='acts'><button class='btn pri' data-act='dclose'>Done</button></div>";
  dlg.innerHTML=h;
}

// ---------- copy helper ----------
function copyOut(fmtv,c,msgEl,taFallback){
  var ok=function(){msgEl.textContent="Copied – ready to paste.";};
  var fail=function(){
    if(taFallback){taFallback.style.display="";taFallback.value=fmtv==="md"?c.md:c.plain;taFallback.rows=Math.min(24,taFallback.value.split("\n").length+1);taFallback.focus();taFallback.select();msgEl.textContent="Couldn't copy automatically – the text below is selected, so copy it now.";}
    else msgEl.textContent="Couldn't copy automatically here – switch to Plain and copy the text from the box.";
  };
  try{
    if(fmtv==="rich"&&window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([c.html],{type:"text/html"}),"text/plain":new Blob([c.plain],{type:"text/plain"})})]).then(ok,fail);
    }else navigator.clipboard.writeText(fmtv==="md"?c.md:c.plain).then(ok,fail);
  }catch(e){fail();}
}

// ---------- events ----------
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act,k=el.dataset.k;
  if(el.tagName==="A")ev.preventDefault();
  switch(a){
    case "tab":view=el.dataset.v;render();window.scrollTo(0,0);break;
    case "wk":weekOff=el.dataset.d==="0"?0:weekOff+(+el.dataset.d)*(fortnight?2:1);render();break;
    case "span":fortnight=el.dataset.v==="1";render();break;
    case "mmode":monthMode=el.dataset.v;render();break;
    case "mo":monthOff=el.dataset.d==="0"?0:monthOff+(+el.dataset.d);render();break;
    case "day":ev.stopPropagation();openDay(k);break;
    case "qadd":ev.stopPropagation();(S.workouts[k]=S.workouts[k]||[]).push({t:el.dataset.t,w:"",n:""});changed();break;
    case "sumfmt":sumFmt=el.dataset.v;render();break;
    case "copysum":{var st=add(monday(today()),weekOff*7);copyOut(sumFmt,weekSummary(st,fortnight?14:7),document.getElementById("summsg"),document.getElementById("sumta"));break;}
    case "book":{var d=P(k);sessionsFor(d).forEach(function(t,i){if(t==="C"&&i!==2&&!rotaLeaveFor(d,i))S.leave[lk(d,i)]=1;});changed();break;}
    case "qr":listFrom=K(today());if(el.dataset.v==="next3"){var e3=today();e3.setMonth(e3.getMonth()+3);listTo=K(e3);}else listTo=yearEnd();render();break;
    case "lfmt":listFmt=el.dataset.v;render();break;
    case "lcopy":copyOut(listFmt,listContent(),document.getElementById("lmsg"),document.getElementById("lta"));break;
    case "pat":{var p=el.dataset.p.split("-").map(Number),cur=S.pattern[p[0]][p[1]][p[2]],nx=CYCLE[(CYCLE.indexOf(cur)+1)%CYCLE.length];
      S.pattern[p[0]][p[1]][p[2]]=nx;if(editMirror)S.pattern[(p[0]+4)%8][p[1]][p[2]]=nx;changed();break;}
    case "resetpat":S.pattern=defaultPattern();changed();break;
    case "delbl":S.blocks=S.blocks.filter(function(x){return x.id!==el.dataset.id;});changed();break;
    case "addbl":S.blocks.push({id:"b"+Date.now(),label:"New period",start:"",end:"",kind:"booked"});changed();break;
    case "unoc":delete S.onCall[k];changed();break;
    case "gon":{var t=document.getElementById("gtok").value.replace(/\s+/g,""),g=document.getElementById("ggist").value,m=document.getElementById("gmsg");
      if(!t){m.textContent="Add your token first.";break;}m.textContent="Connecting…";
      syncConnect(t,g).then(function(){if(!gh.gist)throw new Error(syncText);render();}).catch(function(e){m.textContent=(e&&e.message)||"Couldn't connect.";if(!gh.gist)syncDisconnect();});break;}
    case "gcopy":try{navigator.clipboard.writeText(gh.gist).then(function(){el.textContent="Copied";},function(){});}catch(e){}break;
    case "gnow":el.textContent="Syncing…";syncPull().then(function(){render();});break;
    case "goff":syncDisconnect();render();break;
    case "bkcopy":{var code=JSON.stringify(S),msg=document.getElementById("bkmsg"),ta=document.getElementById("bkin");
      try{navigator.clipboard.writeText(code).then(function(){msg.textContent="Copied.";},function(){ta.value=code;ta.select();msg.textContent="Copy the code from the box.";});}catch(e){ta.value=code;ta.select();}break;}
    case "bkrestore":try{var o=JSON.parse(document.getElementById("bkin").value);if(!o||!o.pattern||!o.leave)throw 0;S=o;changed();view="week";render();}catch(e){document.getElementById("bkmsg").textContent="That doesn't look like a valid backup code.";}break;
    case "clearleave":if(el.dataset.armed){S.leave={};changed();}else{el.dataset.armed=1;el.textContent="Tap again to confirm";}break;
    // dialog
    case "dnav":{closeNoteSave();dlgDate=K(add(P(dlgDate),+el.dataset.d));renderDlg();break;}
    case "dclose":closeDay();break;
    case "lv":{var dd=P(dlgDate),key=lk(dd,+el.dataset.i);if(S.leave[key])delete S.leave[key];else S.leave[key]=1;changed(true);renderDlg();break;}
    case "lvall":{var dd2=P(dlgDate),s2=sessionsFor(dd2),cl=s2.map(function(t,i){return t==="C"&&i!==2&&!rotaLeaveFor(dd2,i)?i:-1;}).filter(function(i){return i>=0;}),on=cl.every(function(i){return isPlanned(dd2,i);});
      cl.forEach(function(i){if(on)delete S.leave[lk(dd2,i)];else S.leave[lk(dd2,i)]=1;});changed(true);renderDlg();break;}
    case "wadd":(S.workouts[dlgDate]=S.workouts[dlgDate]||[]).push({t:el.dataset.t,w:"",n:""});changed(true);renderDlg();var ins=dlg.querySelectorAll("[data-in='wn']");if(ins.length)ins[ins.length-1].focus();break;
    case "wrm":wos(dlgDate).splice(+el.dataset.i,1);if(!wos(dlgDate).length)delete S.workouts[dlgDate];changed(true);renderDlg();break;
  }
});
function closeNoteSave(){
  var nt=dlg.querySelector("[data-in='dnote']");
  if(nt){var v=nt.value.replace(/\s+$/,"");if(v!==(S.notes[dlgDate]||"")){if(v)S.notes[dlgDate]=v;else delete S.notes[dlgDate];changed(true);}}
}
document.addEventListener("change",function(ev){
  var el=ev.target,a=el.dataset&&el.dataset.in;if(!a)return;
  switch(a){
    case "lf":listFrom=el.value||null;render();break;
    case "lt":listTo=el.value||null;render();break;
    case "motion":{var m=ym(today()),n=Math.max(0,parseInt(el.value,10)||0);S.motionPlans=S.motionPlans.filter(function(p){return p.from!==m;});S.motionPlans.push({from:m,n:n});changed();break;}
    case "wot":if(!S.woTemplate)S.woTemplate={};S.woTemplate[el.dataset.k]=el.value.trim();changed();break;
    case "mirror":editMirror=el.checked;break;
    case "annual":S.annual=Math.max(0,parseInt(el.value,10)||0);changed();break;
    case "ystart":if(el.value){S.yearStart=el.value.slice(5);changed();}break;
    case "adj":S.adjust[yearBounds().key]=Math.max(0,parseInt(el.value,10)||0);changed();break;
    case "anchor":if(el.value){var d=monday(P(el.value));S.anchor=K(d);changed();}break;
    case "resfree":S.researchFree=el.checked;changed();break;
    case "pa":S.pa[el.dataset.f]=parseFloat(el.value)||0;changed();break;
    case "paitem":S.pa.items[+el.dataset.i].pa=parseFloat(el.value)||0;changed();break;
    case "bl":{var b=S.blocks.filter(function(x){return x.id===el.dataset.id;})[0];if(b){b[el.dataset.f]=el.value;changed();}break;}
    case "doc":if(el.checked)S.onCall[dlgDate]=1;else delete S.onCall[dlgDate];changed(true);break;
    case "wt":wos(dlgDate)[+el.dataset.i].t=el.value;changed(true);renderDlg();break;
    case "ww":wos(dlgDate)[+el.dataset.i].w=el.value;changed(true);break;
    case "wn":wos(dlgDate)[+el.dataset.i].n=el.value.trim();changed(true);break;
    case "dnote":closeNoteSave();break;
  }
});
scrim.addEventListener("click",function(ev){if(ev.target===scrim)closeDay();});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&scrim.classList.contains("on"))closeDay();});

// ---------- boot ----------
migrate();
try{var ui=JSON.parse(sessionStorage.getItem("lp-ui")||"null");if(ui){view=ui.view||view;weekOff=ui.weekOff||0;fortnight=!!ui.fortnight;monthOff=ui.monthOff||0;monthMode=ui.monthMode||"grid";sessionStorage.removeItem("lp-ui");setTimeout(function(){window.scrollTo(0,ui.y||0);},30);}}catch(e){}
render();
window.addEventListener("beforeunload",function(){if(dirty&&art)save();});
function enableLS(){
  lsMode=true;
  try{var x=localStorage.getItem("leave-planner-state");if(x){var o=JSON.parse(x);if(o&&o.pattern){S=o;migrate();}}}catch(e){}
  if(gh.token&&gh.gist){syncText="Syncing…";syncPull().then(function(){render();});}
}
document.addEventListener("visibilitychange",function(){if(lsMode&&document.visibilityState==="visible"&&gh.token&&gh.gist)syncPull().then(function(c){if(c&&!dlgDate)render();else setSaveText(syncText);});});
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(a){if(a)art=a;else enableLS();render();}).catch(function(){enableLS();render();});
}else{enableLS();render();}
})();
</script>
